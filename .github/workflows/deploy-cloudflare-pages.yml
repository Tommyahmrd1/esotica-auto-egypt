name: Deploy Esotica to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node --check site.js
          node --input-type=module --check < _worker.js
          node scripts/validate-site.mjs
          node --check admin.js
          node --test scripts/*.test.mjs

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=esotica-auto-egypt --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test live site
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://esoticaegypt.com"
          echo "Waiting for Pages deployment to propagate..."
          sleep 8

          health="$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors "$BASE/api/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"database":true'
          echo "$health" | grep -q '"adminConfigured":true'

          for path in / /booking /parts /services /range-rover-land-rover-service /jaguar-service /luxury-car-service /bmw-service /mercedes-service /porsche-service /bentley-service /maserati-service /ferrari-service /lamborghini-service /aston-martin-service /mclaren-service /rolls-royce-service /corvette-service /branches /branches/fifth-settlement /branches/third-settlement /branches/sheikh-zayed /offers /warranty-insurance /about /privacy /contact /admin; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" --retry 6 --retry-delay 3 --retry-all-errors "$BASE$path")"
            echo "$path -> $code"
            test "$code" = "200"
          done

          echo "Checking sitemap and robots..."
          sitemap_headers="$(curl -fsSI --retry 6 --retry-delay 3 --retry-all-errors "$BASE/sitemap.xml")"
          echo "$sitemap_headers"
          echo "$sitemap_headers" | grep -qi '^content-type: application/xml'
          sitemap_body="$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors "$BASE/sitemap.xml")"
          grep -q '<urlset' <<< "$sitemap_body"
          robots_body="$(curl -fsS --retry 6 --retry-delay 3 --retry-all-errors "$BASE/robots.txt")"
          grep -q 'Sitemap: https://esoticaegypt.com/sitemap.xml' <<< "$robots_body"
          echo "Sitemap endpoint OK"

          for legacy in "https://www.esoticaegypt.com/" "https://esotica-auto-egypt.pages.dev/"; do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "$legacy")"
            legacy_headers="$(curl -sSI "$legacy")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2; exit}' <<< "$legacy_headers")"
            echo "$legacy -> $code -> $location"
            case "$code" in 301|302|307|308) ;; *) exit 1 ;; esac
            echo "$location" | grep -q '^https://esoticaegypt.com/'
          done
