name: Extract Esotica V7

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-v7.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V7 package into repository root
        shell: bash
        run: |
          set -euo pipefail
          ZIP='esotica-cloudflare-final-v7-easy-editor (1).zip'
          test -f "$ZIP"
          TMP="$(mktemp -d)"
          unzip -q "$ZIP" -d "$TMP"
          rm -rf "$TMP/.github"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          cp -a "$TMP"/. .
          rm -f "$ZIP" '__upload_probe.txt'

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Extract Esotica V7 project files'
            git push origin HEAD:main
          fi
